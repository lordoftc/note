<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7719aa">
<script>try{var t=localStorage.getItem("notes.theme");if(/^(light|dark|soft)$/.test(t))document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Mes Notes</title>
<style>
/* Thèmes : clair (défaut) · sombre · sombre doux · automatique (sans data-theme = suit l'appareil) */
:root{
  color-scheme:light;
  --accent:#7719aa; --accent-soft:#efe3f6; --bg:#ffffff; --bg2:#f5f5f7; --bg3:#ebebef;
  --text:#1c1c1e; --muted:#76767c; --line:#e0e0e6; --sel:#dcebf7; --danger:#c42b1c;
  --on-accent:#fff; --mark-bg:#fff17a; --mark-fg:#000; --grad:#3d0a5c; --shadow:rgba(0,0,0,.35);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --accent:#b36ae0; --accent-soft:#34203f; --bg:#1b1b1f; --bg2:#242429; --bg3:#2d2d33;
  --text:#f2f2f4; --muted:#9a9aa3; --line:#38383f; --sel:#2b3f55; --danger:#ff7b72;
  --on-accent:#fff; --mark-bg:#e6d35c; --mark-fg:#000; --grad:#3d0a5c; --shadow:rgba(0,0,0,.6);
}
:root[data-theme="soft"]{
  color-scheme:dark;
  --accent:#a590dc; --accent-soft:#363250; --bg:#262932; --bg2:#2d303a; --bg3:#373b47;
  --text:#c8ccd6; --muted:#8a92a2; --line:#3a3e4a; --sel:#35445c; --danger:#e0908a;
  --on-accent:#1d1830; --mark-bg:#6e6a3a; --mark-fg:#f0ecd0; --grad:#2b2642; --shadow:rgba(0,0,0,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    color-scheme:dark;
    --accent:#b36ae0; --accent-soft:#34203f; --bg:#1b1b1f; --bg2:#242429; --bg3:#2d2d33;
    --text:#f2f2f4; --muted:#9a9aa3; --line:#38383f; --sel:#2b3f55; --danger:#ff7b72;
    --on-accent:#fff; --mark-bg:#e6d35c; --mark-fg:#000; --grad:#3d0a5c; --shadow:rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- Auth ---------- */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(160deg,var(--accent),var(--grad))}
.card{width:100%;max-width:380px;background:var(--bg);border-radius:18px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.logo{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:28px;margin:0 auto 12px}
.card h1{text-align:center;margin:0 0 4px;font-size:22px}
.card p.sub{text-align:center;margin:0 0 20px;color:var(--muted);font-size:14px}
.tabs{display:flex;background:var(--bg2);border-radius:10px;padding:3px;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--bg);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.card input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.card input:focus{outline:2px solid var(--accent);border-color:transparent}
.primary{width:100%;margin-top:18px;padding:14px;background:var(--accent);color:var(--on-accent);border-radius:10px;font-weight:700}
.primary:active{opacity:.85}
.primary:disabled{opacity:.5}
#authErr{color:var(--danger);font-size:13px;min-height:18px;margin-top:10px;text-align:center}
.note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.4}

/* ---------- App layout ---------- */
#app{height:100%;display:grid;grid-template-columns:260px 300px 1fr;overflow:hidden}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.col-nav{background:var(--bg2);border-right:1px solid var(--line)}
.col-pages{border-right:1px solid var(--line)}
.top{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);min-height:56px}
.top h2{margin:0;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{flex:1;min-width:0;line-height:1.2}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font-size:12px;color:var(--muted)}
.icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:none}
.icon:hover,.icon:active{background:var(--bg3)}
.back{display:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

.item{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;min-height:46px;border-left:4px solid transparent}
.item:hover{background:var(--bg3)}
.item.active{background:var(--sel)}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .dot{width:14px;height:14px;border-radius:4px;flex:none}
.item .more{color:var(--muted);padding:4px 8px;border-radius:6px}
.sec{padding-left:38px;font-size:15px}
.add{color:var(--accent);font-weight:600;padding:12px 14px;display:flex;gap:8px;width:100%;text-align:left}
.add.sub{padding-left:38px;font-size:14px}
.navfoot{border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:4px}
.navfoot button{padding:11px 6px;font-size:13px;color:var(--muted);border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navfoot #btnAch{color:var(--accent);font-weight:700}
.navfoot button:hover{background:var(--bg3)}

.search{padding:10px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);font-size:15px}
.page{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.page:hover{background:var(--bg2)}
.page.active{background:var(--sel)}
.page b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{color:var(--accent)!important}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}

.title-in{flex:1;min-width:0;border:0;background:none;font-size:20px;font-weight:700;padding:6px 4px;font-family:ui-monospace,Menlo,Consolas,monospace}
.title-in:focus{outline:none}
.toolbar{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:var(--bg2);flex:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar button{min-width:40px;height:40px;border-radius:8px;font-size:16px;flex:none;padding:0 8px}
.toolbar button:active,.toolbar button:hover{background:var(--bg3)}
.toolbar .sep{width:1px;background:var(--line);margin:6px 4px;flex:none}
.meta{padding:10px 18px 0;color:var(--muted);font-size:12.5px}
#editor{flex:1;overflow-y:auto;padding:12px 18px calc(60px + env(safe-area-inset-bottom));outline:none;font-size:16.5px;line-height:1.55;-webkit-overflow-scrolling:touch;word-wrap:break-word}
#editor h1{font-size:26px;margin:.5em 0 .3em;color:var(--accent)}
#editor h2{font-size:21px;margin:.5em 0 .3em}
#editor img{max-width:100%;height:auto;border-radius:8px;margin:8px 0;display:block}
#editor .todo{display:flex;gap:10px;align-items:flex-start;margin:4px 0}
#editor .todo input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
#editor .todo.done span{text-decoration:line-through;color:var(--muted)}
#editor .todo span{flex:1;min-width:0;outline:none}
.noPage{flex:1;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
#toast.on{opacity:.92;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:40;color:var(--muted)}
/* Markdown + recherche */
#editor h3{font-size:18px;margin:.5em 0 .3em}
#editor blockquote{margin:.6em 0;padding:.2em 14px;border-left:4px solid var(--accent);color:var(--muted)}
#editor code{background:var(--bg3);padding:1px 6px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
#editor pre{background:var(--bg3);padding:12px;border-radius:8px;overflow-x:auto}
#editor pre code{background:none;padding:0}
#editor hr{border:0;border-top:1px solid var(--line);margin:1em 0}
#editor a{color:var(--accent)}
#editor mark,.page mark{background:var(--mark-bg);color:var(--mark-fg);border-radius:3px;padding:0 2px}
#editor span[style*="background"]{color:var(--mark-fg)!important}
#mdBox{flex:1;width:100%;border:0;resize:none;outline:none;background:var(--bg);color:var(--text);padding:12px 18px calc(60px + env(safe-area-inset-bottom));font:15px/1.6 ui-monospace,Menlo,Consolas,monospace}
.toolbar button.on{background:var(--accent);color:var(--on-accent)}
.col-nav .search input{background:var(--bg)}
.col-nav .page{background:transparent}
.col-nav .page:hover{background:var(--bg3)}

/* Indicateur d'enregistrement */
.icon.dirty{position:relative}
.icon.dirty::after{content:"";position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:#f59e0b}
.meta .unsaved{color:#d97706;font-weight:600}

/* Fenêtre (succès, thème) */
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--text);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px var(--shadow)}
.sheet-top{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line)}
.sheet-top h2{margin:0;flex:1;font-size:18px}
.sheet-body{overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet-body h3{margin:22px 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.sheet-body h3 small{color:var(--muted);font-weight:500;font-size:12.5px}
@media (min-width:900px){#modal{align-items:center}.sheet{border-radius:18px;max-height:86vh}}

/* Thèmes */
.theme-opt{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;margin-bottom:10px;text-align:left;background:var(--bg2)}
.theme-opt.on{border-color:var(--accent)}
.theme-opt .sw{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);flex:none}
.theme-opt b{display:block}
.theme-opt small{color:var(--muted)}
.theme-opt .ck{margin-left:auto;color:var(--accent);font-weight:700;font-size:20px}

/* Succès */
.lvl{display:flex;gap:14px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:14px}
.lvl-n{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.lvl-t{flex:1;min-width:0}
.lvl-t b{font-size:17px;display:block}
.lvl-t small{color:var(--muted);display:block;margin:2px 0 8px}
.bar{height:7px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.lvl .bar{background:rgba(127,127,127,.25)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;min-width:0}
.stat b{display:block;font-size:17px}
.stat small{color:var(--muted);font-size:11.5px}
.goal{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.goal .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.goal.ok{border-color:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.badge .bi{font-size:28px;filter:grayscale(1);opacity:.4;line-height:1.1}
.badge b{font-size:14px}
.badge small{color:var(--muted);font-size:12px;line-height:1.3}
.badge .bar{margin-top:6px}
.badge .pr{font-size:11.5px;color:var(--muted);margin-top:2px}
.badge.on{border-color:var(--accent);background:var(--accent-soft)}
.badge.on .bi{filter:none;opacity:1}
#achToast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;width:max-content;transform:translate(-50%,-160%);z-index:70;display:flex;gap:12px;align-items:center;background:var(--bg);color:var(--text);border:2px solid var(--accent);border-radius:16px;padding:10px 18px;box-shadow:0 10px 30px var(--shadow);transition:transform .45s cubic-bezier(.2,1.2,.4,1);max-width:92%;pointer-events:none}
#achToast.on{transform:translate(-50%,0)}
#achToast .ti{font-size:30px}
#achToast small{display:block;color:var(--accent);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}

@media (max-width:899px){
  #app{display:block;position:relative}
  .col{position:absolute;inset:0;transform:translateX(100%);transition:transform .25s ease;border:0}
  .col-nav{transform:translateX(0)}
  body[data-view="pages"] .col-pages,
  body[data-view="edit"] .col-pages,
  body[data-view="edit"] .col-edit{transform:translateX(0)}
  body[data-view="pages"] .col-edit{transform:translateX(100%)}
  .back{display:grid}
  #editor{font-size:17px}
}
@media (min-width:900px) and (max-width:1199px){
  #app{grid-template-columns:230px 260px 1fr}
}
/* Ordinateur : plus de marge de chaque côté du texte, surtout à droite */
@media (min-width:900px){
  .meta{padding-left:36px;padding-right:clamp(48px,12%,180px)}
  #editor,#mdBox{padding-left:36px;padding-right:clamp(48px,12%,180px)}
}
</style>
</head>
<body data-view="nav">

<div id="loading">Chargement…</div>

<!-- ================= LOGIN ================= -->
<div id="auth" class="hidden">
  <form class="card" id="authForm">
    <div class="logo">📓</div>
    <h1>Mes Notes</h1>
    <p class="sub">Synchronisées sur tous vos appareils</p>
    <div class="tabs">
      <button type="button" id="tabLogin" class="on">Connexion</button>
      <button type="button" id="tabReg">Créer un compte</button>
    </div>
    <label for="u">Nom d'utilisateur</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required minlength="3">
    <label for="p">Mot de passe</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required minlength="6">
    <div id="p2wrap" class="hidden">
      <label for="p2">Confirmer le mot de passe</label>
      <input id="p2" type="password" autocomplete="new-password">
    </div>
    <button class="primary" id="authBtn" type="submit">Se connecter</button>
    <div id="authErr"></div>
    <div class="note">☁ Vos notes sont stockées de façon privée sur Firebase et accessibles uniquement avec votre compte.</div>
  </form>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <section class="col col-nav">
    <div class="top">
      <div class="avatar" id="avatar">?</div>
      <div class="who"><b id="userName">Utilisateur</b><small id="sync">…</small></div>
      <button class="icon" id="btnLogout" title="Se déconnecter" aria-label="Se déconnecter">⎋</button>
    </div>
    <div class="search"><input id="qNav" type="search" placeholder="🔍 Rechercher dans toutes les notes" autocomplete="off"></div>
    <div class="scroll" id="nav"></div>
    <div class="navfoot">
      <button id="btnAch">🏆 Succès</button>
      <button id="btnTheme">🎨 Thème</button>
      <button id="btnImportMd">⬆ Importer .md</button>
      <button id="btnExport">⬇ Sauvegarde</button>
      <input type="file" id="fileMd" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple class="hidden">
    </div>
  </section>

  <section class="col col-pages">
    <div class="top">
      <button class="icon back" id="backNav" aria-label="Retour">‹</button>
      <h2 id="secTitle">Pages</h2>
      <button class="icon" id="btnAddPage" title="Nouvelle page" aria-label="Nouvelle page">＋</button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="🔍 Rechercher dans mes notes"></div>
    <div class="scroll" id="pages"></div>
  </section>

  <section class="col col-edit">
    <div class="top">
      <button class="icon back" id="backPages" aria-label="Retour">‹</button>
      <input class="title-in" id="title" placeholder="Titre de la page" maxlength="120">
      <button class="icon" id="btnSave" title="Enregistrer (Ctrl+S)" aria-label="Enregistrer">💾</button>
      <button class="icon" id="btnDelPage" title="Supprimer la page" aria-label="Supprimer">🗑</button>
    </div>
    <div class="toolbar" id="toolbar">
      <button data-cmd="h1" title="Titre"><b>H1</b></button>
      <button data-cmd="h2" title="Sous-titre"><b>H2</b></button>
      <span class="sep"></span>
      <button data-cmd="bold"><b>B</b></button>
      <button data-cmd="italic"><i>I</i></button>
      <button data-cmd="underline"><u>U</u></button>
      <button data-cmd="mark" title="Surligner">🖍</button>
      <span class="sep"></span>
      <button data-cmd="ul" title="Liste à puces">• ≡</button>
      <button data-cmd="ol" title="Liste numérotée">1.≡</button>
      <button data-cmd="todo" title="Case à cocher">☑</button>
      <span class="sep"></span>
      <button data-cmd="img" title="Insérer une image">🖼</button>
      <button data-cmd="quote" title="Citation">❝</button>
      <button data-cmd="code" title="Code"><b>&lt;/&gt;</b></button>
      <button data-cmd="clear" title="Effacer le format">⌫</button>
      <span class="sep"></span>
      <button data-cmd="md" id="btnMd" title="Voir / éditer en Markdown"><b>MD</b></button>
      <button data-cmd="exportmd" title="Exporter cette page en .md">⬇</button>
      <input type="file" id="fileImg" accept="image/*" class="hidden">
    </div>
    <div class="meta" id="meta"></div>
    <div id="editor" contenteditable="true" spellcheck="true"></div>
    <textarea id="mdBox" class="hidden" spellcheck="false" aria-label="Markdown"></textarea>
    <div class="noPage hidden" id="noPage">Sélectionnez ou créez une page<br>pour commencer à écrire ✍️</div>
  </section>
</div>
<div id="toast"></div>
<div id="achToast" role="status" aria-live="polite"></div>
<div id="modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <div class="sheet-top"><h2 id="mTitle"></h2><button class="icon" id="mClose" aria-label="Fermer">✕</button></div>
    <div class="sheet-body" id="mBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }

import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         doc, collection, setDoc, deleteDoc, onSnapshot, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* =====================================================================

      (Console Firebase > Paramètres du projet > Vos applications > Web)

  storageBucket: "note-88311.firebasestorage.app",
  messagingSenderId: "972629111443",

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const COLORS = ["#8b5cf6","#f97316","#10b981","#ef4444","#3b82f6","#eab308","#ec4899","#14b8a6"];
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain = html => { const d = document.createElement("div"); d.innerHTML = html.replace(/<img[^>]*>/gi, " "); return (d.textContent || "").replace(/​/g, "").replace(/\s+/g," ").trim(); };
const fmtDate = t => new Date(t).toLocaleString("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" });
const fmtShort = t => { const d = new Date(t), n = new Date(); return d.toDateString() === n.toDateString() ? d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); };
let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }
const toEmail = n => n.includes("@") ? n : n + "@notes.invalid";   // identifiant -> e-mail technique
const fromEmail = e => e.replace(/@notes\.invalid$/, "");

let auth, db;
if (configured) {
  const app = initializeApp(firebaseConfig);

  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

/* ---------- Auth UI ---------- */
let mode = "login";
function setMode(m){
  mode = m;
  $("#tabLogin").classList.toggle("on", m==="login"); $("#tabReg").classList.toggle("on", m==="reg");
  $("#p2wrap").classList.toggle("hidden", m==="login");
  $("#authBtn").textContent = m==="login" ? "Se connecter" : "Créer mon compte";
  $("#p").autocomplete = m==="login" ? "current-password" : "new-password";
  $("#authErr").textContent = "";
}
$("#tabLogin").onclick = () => setMode("login");
$("#tabReg").onclick = () => setMode("reg");
const AUTH_ERR = {
  "auth/invalid-credential":"Identifiants incorrects.", "auth/wrong-password":"Identifiants incorrects.",
  "auth/user-not-found":"Identifiants incorrects.", "auth/email-already-in-use":"Ce nom d'utilisateur existe déjà.",
  "auth/weak-password":"Mot de passe trop faible (6 caractères minimum).", "auth/invalid-email":"Nom d'utilisateur invalide.",
  "auth/network-request-failed":"Pas de connexion internet.", "auth/too-many-requests":"Trop d'essais, réessayez plus tard.",
  "auth/operation-not-allowed":"Activez « E-mail/Mot de passe » dans Firebase > Authentication > Sign-in method."
};
$("#authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("#authErr"), btn = $("#authBtn"); err.textContent = "";
  if (!configured) return err.textContent = "Firebase n'est pas configuré (voir le début du script).";

});
$("#btnLogout").onclick = async () => {
  await Promise.race([flushSave(), new Promise(r => setTimeout(r, 3000))]);   // ne bloque pas la déconnexion hors-ligne
  await signOut(auth);
};

/* ---------- État ---------- */
let uidUser = null, unsubStruct = null, unsubPages = null;
let struct = { notebooks: [] };               // [{id,name,color,sections:[{id,name}]}]
const pages = new Map();                      // id -> {id,nb,sec,title,html,created,updated}
let sel = { nb: null, sec: null, page: null };
let view = "nav", query = "", structReady = false, creatingStarter = false;
const dirty = new Set(); let saveT = null;

const structRef = () => doc(db, "users", uidUser, "meta", "structure");
const pageRef = id => doc(db, "users", uidUser, "pages", id);
const curNb = () => struct.notebooks.find(n => n.id === sel.nb);
const curSec = () => curNb()?.sections.find(s => s.id === sel.sec);
const curPage = () => pages.get(sel.page);
const secPages = () => [...pages.values()].filter(p => p.sec === sel.sec);
const setView = v => { view = v; document.body.dataset.view = v; watchRead(); };
const saveSel = () => { try { localStorage.setItem("notes.sel." + uidUser, JSON.stringify(sel)); } catch {} };

/* ---------- Écriture ---------- */
async function saveStruct(){ try { await setDoc(structRef(), struct); } catch (e) { toast("Erreur d'enregistrement : " + e.code); } }
const SAVE_MS = 60000;   // enregistrement automatique : 60 s après la première modification (ou Ctrl+S / bouton 💾)
function setMeta(){
  const p = curPage(); if (!p) return;
  const un = dirty.has(p.id);
  $("#meta").innerHTML = esc(fmtDate(p.updated)) + (un ? ' · <span class="unsaved">● non enregistré (Ctrl+S)</span>' : " · ✔ enregistré");
  $("#btnSave").classList.toggle("dirty", un);
}
function scheduleSave(){ if (!saveT) saveT = setTimeout(flushSave, SAVE_MS); }
function queuePage(id){ dirty.add(id); scheduleSave(); setMeta(); }
function flushSave(){
  clearTimeout(saveT); saveT = null;
  if (!uidUser) return Promise.resolve();
  const ids = [...dirty]; dirty.clear();
  const jobs = [], fail = e => toast("Erreur d'enregistrement : " + (e.code || e.message));
  for (const id of ids) {
    const p = pages.get(id); if (!p) continue;
    if (JSON.stringify(p).length > 950000) { toast("⚠ Page trop volumineuse (limite 1 Mo) : retirez des images."); continue; }
    jobs.push(setDoc(pageRef(id), p).catch(fail));
  }
  if (statsDirty && stats) { statsDirty = false; jobs.push(setDoc(statsRef(), stats).catch(fail)); }
  setMeta();
  return Promise.all(jobs);
}
function manualSave(){
  if (!dirty.size && !statsDirty) return toast("✔ Déjà enregistré");
  flushSave(); toast("💾 Enregistré");
}
$("#btnSave").onclick = manualSave;
addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "s") { e.preventDefault(); if (uidUser) manualSave(); }
});

/* ---------- Démarrage / écoute temps réel ---------- */
function showAuth(){ $("#loading").classList.add("hidden"); $("#app").classList.add("hidden"); $("#auth").classList.remove("hidden");
  if (!configured) $("#authErr").textContent = "⚙ Firebase non configuré : collez votre firebaseConfig dans le script."; }

function start(user){
  uidUser = user.uid;
  $("#userName").textContent = fromEmail(user.email || "Utilisateur");
  $("#avatar").textContent = fromEmail(user.email || "?").slice(0,2).toUpperCase();
  try { sel = { ...sel, ...JSON.parse(localStorage.getItem("notes.sel." + uidUser) || "{}") }; } catch {}
  pages.clear(); structReady = false; setView("nav");
  stats = null; statsDirty = false; lastLevel = 0; pagesSynced = false; renderAchBtn();

  unsubStruct = onSnapshot(structRef(), snap => {
    if (!snap.exists()) {
      if (!snap.metadata.fromCache && !creatingStarter) { creatingStarter = true; createStarter(); }
      return;
    }
    struct = snap.data(); structReady = true;
    if (!curNb()) sel.nb = struct.notebooks[0]?.id;
    if (!curSec()) sel.sec = curNb()?.sections[0]?.id;
    if (!curPage()) sel.page = null;
    $("#loading").classList.add("hidden"); $("#auth").classList.add("hidden"); $("#app").classList.remove("hidden");
    renderNav(); renderPages(); if (!sel.page) renderEditor();
  }, err => toast("Erreur de lecture : " + err.code));

  unsubPages = onSnapshot(collection(db, "users", uidUser, "pages"), { includeMetadataChanges: true }, snap => {
    let refresh = false;
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === "removed") { pages.delete(id); if (sel.page === id) { sel.page = null; refresh = true; } }
      else if (!dirty.has(id)) {   // ne jamais écraser une modification locale pas encore enregistrée
        pages.set(id, ch.doc.data());
        const typing = [$("#editor"), $("#title"), $("#mdBox")].includes(document.activeElement);
        if (id === sel.page && !ch.doc.metadata.hasPendingWrites && !typing) refresh = true;
      }
    });
    pagesSynced = !snap.metadata.fromCache;
    setSync(snap.metadata.hasPendingWrites, snap.metadata.fromCache);
    renderNav(); renderPages(); if (refresh) renderEditor();
    scheduleCheck();
  }, err => toast("Erreur de lecture : " + err.code));

  unsubStats = onSnapshot(statsRef(), snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (snap.exists()) { const r = { ...newStats(), ...snap.data() }; stats = stats ? mergeStats(stats, r) : r; }
    else if (!snap.metadata.fromCache && !stats) { stats = newStats(); statsDirty = true; scheduleSave(); }
    if (stats) { renderAchBtn(); scheduleCheck(); }
  }, err => console.warn("stats :", err.code));
}

async function createStarter(){
  const now = Date.now(), nb = uid(), sc = uid(), pid = uid();
  struct = { notebooks: [{ id: nb, name: "Mon carnet", color: COLORS[0], sections: [{ id: sc, name: "Général" }] }] };
  const p = { id: pid, nb, sec: sc, title: "Bienvenue 👋", created: now, updated: now,
    html: "<h1>Bienvenue !</h1><p>Vos notes sont synchronisées en direct sur tous vos appareils, même hors-ligne.</p><div class='todo'><input type='checkbox'><span>Essayer une case à cocher</span></div>" };
  sel = { nb, sec: sc, page: pid };
  await saveStruct(); await setDoc(pageRef(pid), p); creatingStarter = false;
}
function stop(){
  unsubStruct?.(); unsubPages?.(); unsubStats?.(); unsubStruct = unsubPages = unsubStats = null; uidUser = null;
  for (const t of [saveT, readT, wcT, checkT]) clearTimeout(t);
  saveT = readT = wcT = checkT = null; readFor = null; dirty.clear(); stats = null; closeModal();
}
if (configured) onAuthStateChanged(auth, u => { if (u) start(u); else { stop(); showAuth(); } });
else showAuth();

function setSync(pending, cache){
  $("#sync").textContent = !navigator.onLine ? "📴 Hors-ligne (enregistré localement)" : pending ? "⏳ Synchronisation…" : cache ? "☁ Connexion…" : "☁ Synchronisé";
}
addEventListener("online", () => setSync(false, false)); addEventListener("offline", () => setSync(true, true));

/* ---------- Rendu ---------- */
function renderNav(){
  if (!structReady) return;
  if (query && isMobile()) {   // sur mobile : les résultats s'affichent directement sous la barre de recherche
    const l = searchResults();
    $("#nav").innerHTML = l.length ? l.map(resultHtml).join("") : `<div class="empty">Aucun résultat.</div>`;
    return;
  }
  let h = "";
  for (const nb of struct.notebooks) {
    const active = nb.id === sel.nb;
    h += `<div class="item ${active?"active":""}" data-nb="${nb.id}" style="border-left-color:${nb.color}">
      <span class="dot" style="background:${nb.color}"></span><span class="nm">${esc(nb.name)}</span>
      <button class="more" data-menu="nb" data-id="${nb.id}" aria-label="Options">⋯</button></div>`;
    if (active) {
      for (const s of nb.sections) {
        const n = [...pages.values()].filter(p => p.sec === s.id).length;
        h += `<div class="item sec ${s.id===sel.sec?"active":""}" data-sec="${s.id}">
        <span class="nm">${esc(s.name)}</span><span style="color:var(--muted);font-size:12px">${n}</span>
        <button class="more" data-menu="sec" data-id="${s.id}" aria-label="Options">⋯</button></div>`;
      }
      h += `<button class="add sub" id="addSec">＋ Nouvelle section</button>`;
    }
  }
  h += `<button class="add" id="addNb">＋ Nouveau carnet</button>`;
  $("#nav").innerHTML = h;
}
function renderPages(){
  if (!structReady) return;
  const el = $("#pages"); let list;
  if (query) {
    const q = query.toLowerCase();
    list = [...pages.values()].filter(matches);
    $("#secTitle").textContent = `Résultats (${list.length})`;
  } else { list = secPages(); $("#secTitle").textContent = curSec()?.name || "Pages"; }
  if (!list.length) { el.innerHTML = `<div class="empty">${query ? "Aucun résultat." : "Aucune page. Touchez ＋ pour en créer une."}</div>`; return; }
  list.sort(query ? rank : (a,b) => b.updated - a.updated);
  const crumb = p => { const nb = struct.notebooks.find(n => n.id === p.nb); return `${esc(nb?.name||"?")} › ${esc(nb?.sections.find(s => s.id===p.sec)?.name||"?")}`; };
  el.innerHTML = list.map(p => `<div class="page ${p.id===sel.page?"active":""}" data-nb="${p.nb}" data-sec="${p.sec}" data-page="${p.id}">
    ${query ? `<small class="crumb">${crumb(p)}</small>` : ""}
    <b>${hl(p.title || "Sans titre")}</b><small>${fmtShort(p.updated)} · ${hl(snippet(p))}</small></div>`).join("");
}
function renderEditor(){
  const p = curPage(), has = !!p;
  ["#editor","#toolbar","#meta","#title","#btnSave","#btnDelPage"].forEach(s => $(s).classList.toggle("hidden", !has));
  $("#noPage").classList.toggle("hidden", has);
  mdMode = false; $("#mdBox").classList.add("hidden"); $("#btnMd").classList.remove("on");
  if (!has) { watchRead(); return; }
  $("#title").value = p.title; $("#editor").innerHTML = p.html; setMeta(); baseWords(p); watchRead();
}

/* ---------- Navigation / actions ---------- */
$("#nav").addEventListener("click", e => {
  const pg = e.target.closest("[data-page]"); if (pg) return openPageEl(pg);
  const more = e.target.closest("[data-menu]");
  if (more) { e.stopPropagation(); return menu(more.dataset.menu, more.dataset.id); }
  if (e.target.closest("#addNb")) return addNb();
  if (e.target.closest("#addSec")) return addSec();
  const nbEl = e.target.closest("[data-nb]"), secEl = e.target.closest("[data-sec]");
  if (secEl) { sel.sec = secEl.dataset.sec; sel.page = null; query = ""; $("#q").value = ""; $("#qNav").value = ""; saveSel(); renderNav(); renderPages(); renderEditor(); setView("pages"); }
  else if (nbEl) { sel.nb = nbEl.dataset.nb; sel.sec = curNb().sections[0]?.id; sel.page = null; saveSel(); renderNav(); renderPages(); renderEditor(); }
});
async function addNb(){
  const name = prompt("Nom du nouveau carnet :"); if (!name?.trim()) return;
  const nb = { id: uid(), name: name.trim(), color: COLORS[struct.notebooks.length % COLORS.length], sections: [{ id: uid(), name: "Général" }] };
  struct.notebooks.push(nb); sel = { nb: nb.id, sec: nb.sections[0].id, page: null }; saveSel(); renderAll(); await saveStruct();
}
async function addSec(){
  const name = prompt("Nom de la nouvelle section :"); if (!name?.trim()) return;
  const s = { id: uid(), name: name.trim() };
  curNb().sections.push(s); sel.sec = s.id; sel.page = null; saveSel(); renderAll(); setView("pages"); await saveStruct();
}
function renderAll(){ renderNav(); renderPages(); renderEditor(); }
async function menu(type, id){
  const list = type === "nb" ? struct.notebooks : curNb().sections;
  const it = list.find(x => x.id === id); if (!it) return;
  const c = prompt(`« ${it.name} »\n\nTapez 1 pour renommer, 2 pour supprimer :`);
  if (c === "1") { const n = prompt("Nouveau nom :", it.name); if (n?.trim()) { it.name = n.trim(); renderAll(); await saveStruct(); } }
  else if (c === "2") {
    if (list.length === 1) return alert(type === "nb" ? "Gardez au moins un carnet." : "Gardez au moins une section.");
    if (!confirm(`Supprimer « ${it.name} » et tout son contenu ?`)) return;
    const doomed = [...pages.values()].filter(p => type === "nb" ? p.nb === id : p.sec === id);
    const batch = writeBatch(db); doomed.forEach(p => { batch.delete(pageRef(p.id)); pages.delete(p.id); dirty.delete(p.id); });
    list.splice(list.indexOf(it), 1);
    if (type === "nb") { sel = { nb: struct.notebooks[0].id, sec: struct.notebooks[0].sections[0].id, page: null }; }
    else { sel.sec = list[0].id; sel.page = null; }
    saveSel(); renderAll();
    try { await batch.commit(); await saveStruct(); } catch (e) { toast("Erreur : " + e.code); }
  }
}

/* ---------- Recherche ---------- */
const isMobile = () => matchMedia("(max-width:899px)").matches;
const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const terms = () => query.toLowerCase().split(/\s+/).filter(Boolean);
const plainCache = new Map();
function ptxt(p){
  const c = plainCache.get(p.id);
  if (c && c.u === p.updated && c.l === p.html.length) return c.t;
  const t = plain(p.html); plainCache.set(p.id, { u: p.updated, l: p.html.length, t }); return t;
}
function matches(p){
  const t = terms(); if (!t.length) return true;
  const hay = (p.title + " " + ptxt(p)).toLowerCase();
  return t.every(x => hay.includes(x));
}
function rank(a, b){
  const t = terms(), ia = t.every(x => a.title.toLowerCase().includes(x)), ib = t.every(x => b.title.toLowerCase().includes(x));
  return (ib - ia) || (b.updated - a.updated);
}
function hl(text){
  const t = terms(); if (!t.length) return esc(text);
  const re = new RegExp("(" + t.map(rx).join("|") + ")", "gi");
  return text.split(re).map((s, i) => i % 2 ? "<mark>" + esc(s) + "</mark>" : esc(s)).join("");
}
function snippet(p){
  const txt = ptxt(p), t = terms(); if (!t.length) return txt.slice(0, 70);
  const low = txt.toLowerCase(); let idx = -1;
  for (const x of t) { idx = low.indexOf(x); if (idx >= 0) break; }
  const st = Math.max(0, idx - 25);
  return (st ? "…" : "") + txt.slice(st, st + 90);
}
const searchResults = () => [...pages.values()].filter(matches).sort(rank);
function resultHtml(p){
  const nb = struct.notebooks.find(n => n.id === p.nb), sc = nb?.sections.find(s => s.id === p.sec);
  return `<div class="page ${p.id===sel.page?"active":""}" data-nb="${p.nb}" data-sec="${p.sec}" data-page="${p.id}">
    <small class="crumb">${esc(nb?.name||"?")} › ${esc(sc?.name||"?")}</small>
    <b>${hl(p.title || "Sans titre")}</b><small>${fmtShort(p.updated)} · ${hl(snippet(p))}</small></div>`;
}
function openPageEl(el){
  sel = { nb: el.dataset.nb, sec: el.dataset.sec, page: el.dataset.page }; saveSel();
  renderNav(); renderPages(); renderEditor(); setView("edit");
}

/* ---------- Markdown : Markdown -> HTML ---------- */
let mdMode = false;
const imgStore = [];                         // images (data:) remplacées par img:N dans la vue MD
const safeUrl = u => /^(https?:|mailto:|data:image\/|#)/i.test(u) ? u : "";

function mdInline(s){
  const hold = [], keep = html => "\u0001" + (hold.push(html) - 1) + "\u0002";
  s = s.replace(/`([^`]+)`/g, (_, c) => keep("<code>" + esc(c) + "</code>"));
  s = esc(s);
  const url = u => {
    u = u.replace(/&amp;/g, "&").replace(/&quot;/g, "%22").replace(/&lt;|&gt;/g, "");
    const m = /^img:(\d+)$/.exec(u); if (m) u = imgStore[+m[1]] || "";
    return safeUrl(u);
  };
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, u) => { u = url(u); return u ? keep(`<img src="${u}" alt="${alt}">`) : ""; });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => { u = url(u); return u ? keep(`<a href="${u}" target="_blank" rel="noopener">${t}</a>`) : t; });
  s = s.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (_, a, b) => `<strong>${a || b}</strong>`)
       .replace(/~~([^~]+)~~/g, "<s>$1</s>")
       .replace(/==([^=]+)==/g, "<mark>$1</mark>")
       .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
       .replace(/(^|[^\w])_([^_\n]+)_(?![\w])/g, "$1<em>$2</em>")
       .replace(/&lt;u&gt;(.+?)&lt;\/u&gt;/g, "<u>$1</u>");
  for (let k = 0; k < 2; k++) s = s.replace(/\u0001(\d+)\u0002/g, (_, i) => hold[+i]);
  return s;
}

function mdToHtml(src){
  const lines = String(src).replace(/\r\n?/g, "\n").split("\n"), out = [], stack = [];
  let i = 0, para = [], m;
  const flush = () => { if (para.length) { out.push("<p>" + para.map(mdInline).join("<br>") + "</p>"); para = []; } };
  const closeLists = () => { while (stack.length) out.push("</li></" + stack.pop().tag + ">"); };
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*(```|~~~)/.test(ln)) {                       // bloc de code
      flush(); closeLists(); const buf = []; i++;
      while (i < lines.length && !/^\s*(```|~~~)/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
    }
    if (!ln.trim()) { flush(); closeLists(); i++; continue; }
    if ((m = /^(#{1,6})\s+(.*\S)\s*$/.exec(ln))) {         // titres
      flush(); closeLists(); const n = Math.min(m[1].length, 3);
      out.push(`<h${n}>${mdInline(m[2])}</h${n}>`); i++; continue;
    }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(ln)) { flush(); closeLists(); out.push("<hr>"); i++; continue; }
    if (/^\s*>/.test(ln)) {                                 // citation
      flush(); closeLists(); const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + buf.map(mdInline).join("<br>") + "</blockquote>"); continue;
    }
    if ((m = /^\s*[-*+]\s+\[([ xX])\]\s+(.*)$/.exec(ln))) {  // case à cocher
      flush(); closeLists(); const done = m[1] !== " ";
      out.push(`<div class="todo${done ? " done" : ""}"><input type="checkbox"${done ? " checked" : ""}><span>${mdInline(m[2])}</span></div>`);
      i++; continue;
    }
    if ((m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(ln))) {   // listes (avec imbrication)
      flush();
      const indent = m[1].replace(/\t/g, "    ").length, tag = /\d/.test(m[2]) ? "ol" : "ul";
      while (stack.length && stack[stack.length - 1].indent > indent) out.push("</li></" + stack.pop().tag + ">");
      const top = stack[stack.length - 1];
      if (!top || top.indent < indent) { out.push("<" + tag + "><li>"); stack.push({ tag, indent }); }
      else if (top.tag !== tag) { out.push("</li></" + stack.pop().tag + "><" + tag + "><li>"); stack.push({ tag, indent }); }
      else out.push("</li><li>");
      out.push(mdInline(m[3])); i++; continue;
    }
    closeLists(); para.push(ln.trim()); i++;
  }
  flush(); closeLists();
  return out.join("");
}

/* ---------- Markdown : HTML -> Markdown ---------- */
function htmlToMd(html, embed){
  const root = document.createElement("div"); root.innerHTML = html;
  const imgSrc = src => { if (embed || !/^data:/.test(src)) return src; imgStore.push(src); return "img:" + (imgStore.length - 1); };
  const wrap = (s, mk) => { const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(s); return m[2] ? m[1] + mk + m[2] + mk + m[3] : s; };
  const inl = n => {
    if (n.nodeType === 3) return n.textContent.replace(/​/g, "");
    if (n.nodeType !== 1) return "";
    const k = () => [...n.childNodes].map(inl).join("");
    switch (n.tagName) {
      case "BR": return "  \n";
      case "STRONG": case "B": return wrap(k(), "**");
      case "EM": case "I": return wrap(k(), "*");
      case "U": return "<u>" + k() + "</u>";
      case "S": case "STRIKE": case "DEL": return wrap(k(), "~~");
      case "MARK": return wrap(k(), "==");
      case "CODE": return "`" + n.textContent + "`";
      case "A": return `[${k()}](${n.getAttribute("href") || ""})`;
      case "IMG": return `![${n.getAttribute("alt") || ""}](${imgSrc(n.getAttribute("src") || "")})`;
      case "SPAN": case "FONT": {
        const s = k(), bg = n.style && n.style.backgroundColor;
        return bg && bg !== "transparent" && bg !== "rgba(0, 0, 0, 0)" ? wrap(s, "==") : s;
      }
      default: return k();
    }
  };
  const list = (el, depth) => {
    const ordered = el.tagName === "OL", lines = []; let n = 0;
    for (const li of el.children) {
      if (li.tagName !== "LI") continue; n++;
      let text = ""; const sub = [];
      for (const c of li.childNodes) {
        if (c.nodeType === 1 && (c.tagName === "UL" || c.tagName === "OL")) sub.push(...list(c, depth + 1));
        else text += inl(c);
      }
      lines.push("    ".repeat(depth) + (ordered ? n + ". " : "- ") + text.trim().replace(/\s*\n\s*/g, " "), ...sub);
    }
    return lines;
  };
  const blocks = [];
  const walk = parent => {
    let buf = "";
    const flushBuf = () => { const s = buf.replace(/​/g, "").trim(); if (s) blocks.push({ s }); buf = ""; };
    for (const n of parent.childNodes) {
      if (n.nodeType === 1 && /^(H[1-6]|P|DIV|UL|OL|BLOCKQUOTE|PRE|HR)$/.test(n.tagName)) {
        flushBuf(); const t = n.tagName;
        if (/^H[1-6]$/.test(t)) blocks.push({ s: "#".repeat(Math.min(+t[1], 3)) + " " + inl(n).trim() });
        else if (t === "UL" || t === "OL") blocks.push({ s: list(n, 0).join("\n") });
        else if (t === "BLOCKQUOTE") blocks.push({ s: inl(n).trim().split("\n").map(l => "> " + l.trim()).join("\n") });
        else if (t === "PRE") blocks.push({ s: "```\n" + n.textContent.replace(/\n$/, "") + "\n```" });
        else if (t === "HR") blocks.push({ s: "---" });
        else if (n.classList.contains("todo")) {
          const cb = n.querySelector("input");
          blocks.push({ s: "- [" + (cb && cb.checked ? "x" : " ") + "] " + inl(n.querySelector("span") || n).trim(), todo: true });
        }
        else if (n.querySelector("h1,h2,h3,ul,ol,blockquote,pre,.todo,div,p")) walk(n);
        else { const s = inl(n).replace(/​/g, "").trim(); if (s) blocks.push({ s }); }
      } else buf += inl(n);
    }
    flushBuf();
  };
  walk(root);
  return blocks.map((b, i) => (i ? (b.todo && blocks[i - 1].todo ? "\n" : "\n\n") : "") + b.s).join("");
}

/* ---------- Markdown : raccourcis pendant la frappe ---------- */
const makeTodoEl = () => { const d = document.createElement("div"); d.className = "todo"; d.innerHTML = '<input type="checkbox"><span>&#8203;</span>'; return d; };
const placeCaret = (node, off) => { const r = document.createRange(); r.setStart(node, off); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
function lineStart(){
  const s = getSelection(); if (!s.rangeCount || !s.isCollapsed) return null;
  const n = s.anchorNode; if (!n || n.nodeType !== 3 || !$("#editor").contains(n)) return null;
  if (n.parentElement.closest("li,pre,code,.todo,h1,h2,h3")) return null;
  const prev = n.previousSibling;
  if (prev && !(prev.nodeType === 1 && /^(BR|DIV|P|H[1-6]|UL|OL|BLOCKQUOTE|PRE)$/.test(prev.tagName))) return null;
  return { n, before: n.textContent.slice(0, s.anchorOffset) };
}
$("#editor").addEventListener("keydown", e => {            // "# " "- " "1. " "> " "[] " en début de ligne
  if (e.key !== " " || e.isComposing) return;
  const ctx = lineStart(); if (!ctx) return;
  const t = ctx.before; let act = null;
  if (/^#{1,3}$/.test(t)) act = () => document.execCommand("formatBlock", false, "h" + t.length);
  else if (/^[-*+]$/.test(t)) act = () => document.execCommand("insertUnorderedList");
  else if (/^\d+[.)]$/.test(t)) act = () => document.execCommand("insertOrderedList");
  else if (t === ">") act = () => document.execCommand("formatBlock", false, "blockquote");
  else if (t === "[]" || t === "[ ]") act = "todo";
  if (!act) return;
  e.preventDefault();
  if (act === "todo") {
    let line = ctx.n; while (line.parentNode !== $("#editor")) line = line.parentNode;
    const rest = ctx.n.textContent.slice(t.length), d = makeTodoEl(), span = d.querySelector("span");
    if (line === ctx.n || line.textContent === ctx.n.textContent) {      // ligne = uniquement ce texte : on la remplace
      span.textContent = rest || "​"; line.replaceWith(d); placeCaret(span.firstChild, rest ? 0 : 1);
    } else {                                                             // sinon : on retire le marqueur et on ajoute une case vide
      ctx.n.textContent = rest; line.after(d); placeCaret(span.firstChild, 1);
    }
  } else {
    const r = document.createRange(); r.setStart(ctx.n, 0); r.setEnd(ctx.n, t.length);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    document.execCommand("delete"); act();
  }
  touch();
});
$("#editor").addEventListener("input", e => {              // **gras** *italique* `code` ~~barré~~ ==surligné==
  if (e.inputType !== "insertText" || !e.data || !/[*_`~=]/.test(e.data)) return;
  const s = getSelection(), n = s.anchorNode;
  if (!s.isCollapsed || !n || n.nodeType !== 3 || n.parentElement.closest("pre,code")) return;
  const before = n.textContent.slice(0, s.anchorOffset);
  const rules = [[/\*\*([^*\s][^*]*?)\*\*$/, "strong"], [/(?<![*\w])\*([^*\s][^*]*?)\*$/, "em"], [/(?<![_\w])_([^_\s][^_]*?)_$/, "em"],
                 [/`([^`]+)`$/, "code"], [/~~([^~]+)~~$/, "s"], [/==([^=]+)==$/, "mark"]];
  for (const [re, tag] of rules) {
    const m = re.exec(before); if (!m) continue;
    const r = document.createRange(); r.setStart(n, m.index); r.setEnd(n, s.anchorOffset);
    s.removeAllRanges(); s.addRange(r);
    document.execCommand("insertHTML", false, `<${tag}>${esc(m[1])}</${tag}>&#8203;`);
    return;
  }
});
$("#editor").addEventListener("paste", e => {              // coller du texte Markdown => converti en mise en forme
  const cd = e.clipboardData; if (!cd || cd.types.includes("text/html")) return;
  const txt = cd.getData("text/plain");
  if (/^(#{1,6}\s|\s*[-*+]\s|\s*\d+[.)]\s|>\s|```|---\s*$)|\*\*[^*]+\*\*|\[[^\]]+\]\([^)]+\)/m.test(txt)) {

});

/* ============================================================
   Succès : écrire plus, relire plus
   Les statistiques sont enregistrées dans Firestore (users/{uid}/meta/stats)
   au même rythme que les notes (60 s, Ctrl+S).
   ============================================================ */
const READ_MS = 8000, DAY_WORDS = 100, DAY_READS = 2;
let stats = null, statsDirty = false, unsubStats = null, lastEdit = 0, lastLevel = 0, pagesSynced = false;
let wcT = null, wcBase = 0, wcFor = null, readT = null, readFor = null, readOpen = 0, checkT = null;
const statsRef = () => doc(db, "users", uidUser, "meta", "stats");
const newStats = () => ({ words:0, reads:0, oldReads:0, tasks:0, images:0, nightWords:0, activeDays:0, streak:0, bestStreak:0,
  lastDay:"", bestDayWords:0, bestDayReads:0, day:{ d:"", words:0, reads:0 }, readPages:{}, unlocked:{} });
const pad2 = n => String(n).padStart(2, "0");
const dayStr = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const today = () => dayStr(new Date());
const prevDay = s => { const [y, m, d] = s.split("-").map(Number); return dayStr(new Date(y, m - 1, d - 1)); };
const fmtN = n => Number(n).toLocaleString("fr-FR");
const wordCount = t => { t = t.replace(/​/g, "").trim(); return t ? t.split(/\s+/).length : 0; };
const wcCache = new Map();
function pwords(p){
  const c = wcCache.get(p.id);
  if (c && c.u === p.updated && c.l === p.html.length) return c.w;
  const w = wordCount(ptxt(p)); wcCache.set(p.id, { u: p.updated, l: p.html.length, w }); return w;
}
const liveNotes = () => { let n = 0; for (const p of pages.values()) if (pwords(p) >= 3) n++; return n; };
const curStreak = () => stats && (stats.lastDay === today() || stats.lastDay === prevDay(today())) ? stats.streak : 0;

/* fusion avec la version d'un autre appareil : on ne perd jamais de progression */
function mergeStats(a, b){
  const r = { ...a };
  for (const k of ["words","reads","oldReads","tasks","images","nightWords","activeDays","bestStreak","bestDayWords","bestDayReads"]) r[k] = Math.max(a[k] || 0, b[k] || 0);
  r.unlocked = { ...b.unlocked, ...a.unlocked };
  r.readPages = { ...b.readPages };
  for (const [id, e] of Object.entries(a.readPages || {})) {
    const o = r.readPages[id];
    r.readPages[id] = !o ? e : { d: e.d >= o.d ? e.d : o.d, n: Math.max(e.n, o.n) };
  }
  const x = (a.lastDay || "") >= (b.lastDay || "") ? a : b; r.lastDay = x.lastDay; r.streak = x.streak;
  const ad = a.day || {}, bd = b.day || {};
  r.day = (ad.d || "") === (bd.d || "")
    ? { d: ad.d || "", words: Math.max(ad.words || 0, bd.words || 0), reads: Math.max(ad.reads || 0, bd.reads || 0), gw: ad.gw || bd.gw || 0, gr: ad.gr || bd.gr || 0 }
    : ((ad.d || "") > (bd.d || "") ? ad : bd);
  return r;
}

/* activité du jour, série, compteurs */
const dayObj = () => { const d = today(); if (stats.day.d !== d) stats.day = { d, words:0, reads:0 }; return stats.day; };
function activity(){
  const d = today(); if (stats.lastDay === d) return;
  stats.activeDays++; stats.streak = stats.lastDay === prevDay(d) ? stats.streak + 1 : 1;
  stats.bestStreak = Math.max(stats.bestStreak, stats.streak); stats.lastDay = d;
}
function statsChanged(){ statsDirty = true; scheduleSave(); scheduleCheck(); }
function bump(k){ if (!stats) return; stats[k]++; activity(); statsChanged(); }
function addWords(n){
  if (!stats || n <= 0) return;
  const dd = dayObj(); stats.words += n; dd.words += n; stats.bestDayWords = Math.max(stats.bestDayWords, dd.words);
  if (new Date().getHours() < 5) stats.nightWords += n;
  activity(); statsChanged();
}
function registerRead(p){
  if (!stats) return;
  const d = today(), e = stats.readPages[p.id] || { d:"", n:0 };
  if (e.d === d) return;                                  // une seule relecture par note et par jour
  stats.readPages[p.id] = { d, n: e.n + 1 }; stats.reads++;
  const dd = dayObj(); dd.reads++; stats.bestDayReads = Math.max(stats.bestDayReads, dd.reads);
  if (p.created && Date.now() - p.created > 30 * 864e5) stats.oldReads++;
  activity(); statsChanged();
}

/* mots écrits : mesurés 1,5 s après la frappe, plafonnés pour éviter qu'un gros copier-coller compte comme du travail */
function baseWords(p){ wcFor = p.id; wcBase = pwords(p); }
function markEdit(){
  lastEdit = Date.now(); clearTimeout(wcT);
  wcT = setTimeout(() => {
    const p = curPage(); if (!p || wcFor !== p.id) return;
    const cur = pwords(p), d = cur - wcBase; wcBase = cur;
    if (d > 0) addWords(Math.min(d, 40)); else scheduleCheck();
  }, 1500);
}

/* relecture : note affichée ≥ 8 s, sans modification, au moins 5 mots */
const pageVisible = () => !document.hidden && !!curPage() && (!isMobile() || view === "edit");
function watchRead(){
  const p = curPage();
  if (!p || !pageVisible()) { clearTimeout(readT); readFor = null; return; }
  if (readFor === p.id) return;
  clearTimeout(readT); readFor = p.id; readOpen = Date.now();
  readT = setTimeout(() => {
    const q = curPage();
    if (!q || q.id !== p.id || !pageVisible()) { readFor = null; return; }
    if (lastEdit > readOpen || pwords(q) < 5) return;
    registerRead(q);
  }, READ_MS);
}

/* niveaux */
const LEVELS = ["Novice","Apprenti","Scribe","Chroniqueur","Érudit","Maître des notes","Archiviste","Sage","Légende"];
const xpOf = () => liveNotes() * 20 + Math.floor(stats.words / 20) + stats.reads * 10 + stats.tasks * 3 + stats.activeDays * 15 + Object.keys(stats.unlocked).length * 50;
const levelOf = xp => { const L = Math.floor(Math.sqrt(xp / 50)) + 1; return { L, from: 50 * (L - 1) ** 2, to: 50 * L ** 2, t: LEVELS[Math.min(L - 1, LEVELS.length - 1)] }; };
function renderAchBtn(){ $("#btnAch").textContent = stats ? "🏆 Niv. " + levelOf(xpOf()).L : "🏆 Succès"; }

/* liste des succès : [id, catégorie, icône, nom, description, objectif, valeur actuelle] */
const A = (id, c, i, n, d, g, v) => ({ id, c, i, n, d, g, v });
const secCount = () => struct.notebooks.reduce((n, b) => n + b.sections.length, 0);
const readLive = () => { if (!pagesSynced) return 0; let n = 0; for (const p of pages.values()) if (pwords(p) >= 3 && stats.readPages[p.id]) n++; return n; };
const CATS = { w:"✍️ Écriture", r:"👀 Relecture", s:"🔥 Régularité", o:"🗂️ Organisation" };
const ACH = [
  A("n1",   "w","✍️","Première note",       "Écrire une note",                     1,      () => liveNotes()),
  A("n10",  "w","📝","Carnet bien rempli",  "Avoir 10 notes",                      10,     () => liveNotes()),
  A("n50",  "w","📚","Bibliothèque",        "Avoir 50 notes",                      50,     () => liveNotes()),
  A("n200", "w","🏛️","Grand archiviste",    "Avoir 200 notes",                     200,    () => liveNotes()),
  A("w500", "w","✒️","Premières lignes",    "Écrire 500 mots",                     500,    () => stats.words),
  A("w5k",  "w","🖋️","Plume fluide",        "Écrire 5 000 mots",                   5000,   () => stats.words),
  A("w25k", "w","📖","Romancier",           "Écrire 25 000 mots",                  25000,  () => stats.words),
  A("w100k","w","🧠","Encyclopédie vivante","Écrire 100 000 mots",                 100000, () => stats.words),
  A("day500","w","⚡","Journée productive","Écrire 500 mots en un jour",           500,    () => stats.bestDayWords),
  A("t10",  "w","✅","Fait !",              "Cocher 10 tâches",                    10,     () => stats.tasks),
  A("t50",  "w","🎯","Chasseur de tâches",  "Cocher 50 tâches",                    50,     () => stats.tasks),
  A("img1", "w","🖼️","Illustrateur",        "Ajouter une image à une note",        1,      () => stats.images),
  A("r1",   "r","👀","Première relecture",  "Relire une note",                     1,      () => stats.reads),
  A("r10",  "r","🔍","Lecteur attentif",    "Faire 10 relectures",                 10,     () => stats.reads),
  A("r50",  "r","🐘","Mémoire d'éléphant",  "Faire 50 relectures",                 50,     () => stats.reads),
  A("r200", "r","🎓","Réviseur d'élite",    "Faire 200 relectures",                200,    () => stats.reads),
  A("rday5","r","📅","Séance de révision",  "Relire 5 notes en un jour",           5,      () => stats.bestDayReads),
  A("rold", "r","🕰️","Archéologue",         "Relire une note de plus de 30 jours", 1,      () => stats.oldReads),
  A("rall", "r","🧹","Zéro oubli",          "Avoir relu toutes vos notes (5 minimum)", () => Math.max(5, liveNotes()), () => readLive()),
  A("s3",   "s","🔥","En route",            "Écrire ou relire 3 jours d'affilée",  3,      () => stats.bestStreak),
  A("s7",   "s","🔥","Semaine complète",    "7 jours d'affilée",                   7,      () => stats.bestStreak),
  A("s30",  "s","🌟","Mois de feu",         "30 jours d'affilée",                  30,     () => stats.bestStreak),
  A("night","s","🌙","Noctambule",          "Écrire 100 mots entre minuit et 5 h", 100,    () => stats.nightWords),
  A("nb3",  "o","🗂️","Organisé",            "Avoir 3 carnets",                     3,      () => struct.notebooks.length),
  A("sec6", "o","📂","Bien rangé",          "Avoir 6 sections en tout",            6,      secCount)
];
const goalOf = a => typeof a.g === "function" ? a.g() : a.g;

/* vérification des déblocages + notifications */
const toastQ = []; let toastBusy = false;
function announce(list){
  if (list.length > 3) list = [{ k:"Succès débloqués", i:"🏆", n: list.length + " nouveaux succès !" }];
  toastQ.push(...list); if (!toastBusy) nextToast();
}
function nextToast(){
  const t = toastQ.shift(), el = $("#achToast");
  if (!t) { toastBusy = false; return; }
  toastBusy = true;
  el.innerHTML = `<span class="ti">${t.i}</span><div><small>${esc(t.k)}</small><b>${esc(t.n)}</b></div>`;
  el.classList.add("on");
  setTimeout(() => { el.classList.remove("on"); setTimeout(nextToast, 500); }, 3600);
}
function scheduleCheck(){ clearTimeout(checkT); checkT = setTimeout(checkAch, 400); }
function checkAch(){
  if (!stats || !structReady) return;
  const out = [];
  for (const a of ACH) {
    if (stats.unlocked[a.id]) continue;
    if (a.v() >= goalOf(a)) { stats.unlocked[a.id] = Date.now(); out.push({ k:"Succès débloqué", i:a.i, n:a.n }); }
  }
  const dd = stats.day.d === today() ? stats.day : null;
  if (dd && !dd.gw && dd.words >= DAY_WORDS) { dd.gw = 1; out.push({ k:"Objectif du jour", i:"🎯", n: DAY_WORDS + " mots écrits !" }); }
  if (dd && !dd.gr && dd.reads >= DAY_READS) { dd.gr = 1; out.push({ k:"Objectif du jour", i:"🎯", n: DAY_READS + " notes relues !" }); }
  if (out.length) { statsDirty = true; scheduleSave(); announce(out); }
  const lv = levelOf(xpOf()).L;
  if (lastLevel && lv > lastLevel) announce([{ k:"Niveau supérieur", i:"⬆️", n:"Niveau " + lv + " · " + levelOf(xpOf()).t }]);
  lastLevel = lv;
  renderAchBtn(); if (modalKind === "ach") renderAch();
}

/* panneau Succès */
function badgeHtml(a){
  const ok = stats.unlocked[a.id], g = goalOf(a), v = Math.min(a.v(), g);
  return `<div class="badge ${ok ? "on" : ""}"><span class="bi">${a.i}</span><b>${a.n}</b><small>${a.d}</small>` +
    (ok ? `<span class="pr">✔ ${new Date(ok).toLocaleDateString("fr-FR", { day:"numeric", month:"short", year:"numeric" })}</span>`
        : `<div class="bar"><i style="width:${Math.round(v / g * 100)}%"></i></div><span class="pr">${fmtN(v)} / ${fmtN(g)}</span>`) + `</div>`;
}
function renderAch(){
  const b = $("#mBody");
  if (!stats) { b.innerHTML = '<div class="empty">Chargement de vos statistiques…</div>'; return; }
  const xp = xpOf(), lv = levelOf(xp), pct = Math.round((xp - lv.from) / (lv.to - lv.from) * 100);
  const dd = stats.day.d === today() ? stats.day : { words:0, reads:0 };
  const goal = (ico, label, cur, g) => `<div class="goal ${cur >= g ? "ok" : ""}"><div class="row"><span>${ico} ${label}</span><b>${Math.min(cur, g)} / ${g}${cur >= g ? " ✔" : ""}</b></div><div class="bar"><i style="width:${Math.min(100, cur / g * 100)}%"></i></div></div>`;
  let h = `<div class="lvl"><div class="lvl-n">${lv.L}</div><div class="lvl-t"><b>${lv.t}</b><small>${fmtN(xp)} XP · prochain niveau à ${fmtN(lv.to)} XP</small><div class="bar"><i style="width:${pct}%"></i></div></div></div>`;
  h += `<div class="stats4">` + [["🔥", curStreak(), "jours d'affilée"], ["📝", liveNotes(), "notes"], ["✍️", fmtN(stats.words), "mots écrits"], ["👀", stats.reads, "relectures"]]
    .map(([i, v, l]) => `<div class="stat"><b>${i} ${v}</b><small>${l}</small></div>`).join("") + `</div>`;
  h += `<h3>Objectifs du jour</h3>` + goal("✍️", "Écrire " + DAY_WORDS + " mots", dd.words, DAY_WORDS) + goal("👀", "Relire " + DAY_READS + " notes", dd.reads, DAY_READS);
  for (const [k, label] of Object.entries(CATS)) {
    const list = ACH.filter(a => a.c === k), n = list.filter(a => stats.unlocked[a.id]).length;
    h += `<h3>${label}<small>${n} / ${list.length}</small></h3><div class="badges">` + list.map(badgeHtml).join("") + `</div>`;
  }
  h += `<p class="note" style="margin-top:18px;text-align:left">Une relecture compte quand une note reste ouverte ${READ_MS / 1000} secondes sans être modifiée (une fois par note et par jour). Les mots comptent quand vous les écrivez.</p>`;
  b.innerHTML = h;
}
renderAchBtn();
</script>
